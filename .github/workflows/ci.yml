name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: taipan-linux-x86_64
            bin: taipan
          - runner: ubuntu-24.04-arm
            artifact: taipan-linux-aarch64
            bin: taipan
          - runner: macos-15
            artifact: taipan-macos-aarch64
            bin: taipan
          - runner: macos-15-intel
            artifact: taipan-macos-x86_64
            bin: taipan
          - runner: windows-latest
            artifact: taipan-windows-x86_64
            bin: taipan.exe
            # mingw ABI: links with Zig's bundled toolchain, no MSVC needed
            buildflags: -Dtarget=x86_64-windows-gnu
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            vendor/zig
            vendor/cpython
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_toolchain.sh') }}

      - name: Fetch pinned toolchain
        run: ./tools/fetch_toolchain.sh

      - name: Check formatting
        run: ./vendor/zig/zig fmt --check src build.zig

      - name: Unit tests
        run: ./vendor/zig/zig build test ${{ matrix.buildflags || '' }}

      - name: Build (release)
        # -Dcpu=baseline: a native build targets the build machine's exact
        # CPU; the artifact must run on any same-arch machine (SIGILL bites
        # otherwise — build and smoke-test runners differ per job).
        run: ./vendor/zig/zig build -Drelease=true -Dcpu=baseline ${{ matrix.buildflags || '' }}

      - name: Integration tests
        run: bash tests/test.sh

      - name: Report binary size and linkage
        run: |
          ls -la zig-out/bin/${{ matrix.bin }}
          ldd zig-out/bin/${{ matrix.bin }} 2>/dev/null || otool -L zig-out/bin/${{ matrix.bin }} 2>/dev/null || true

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: zig-out/bin/${{ matrix.bin }}

  smoke-test:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        image: ["debian:bookworm-slim", "ubuntu:24.04", "fedora:latest"]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.runner == 'ubuntu-latest' && 'taipan-linux-x86_64' || 'taipan-linux-aarch64' }}
          path: dist
      - name: Smoke test artifact in ${{ matrix.image }}
        run: |
          chmod +x dist/taipan tests/smoke.sh
          docker run --rm -v "$PWD:/w:ro" "${{ matrix.image }}" \
            bash -c "install /w/dist/taipan /usr/local/bin/taipan && bash /w/tests/smoke.sh /usr/local/bin/taipan /w/examples"

  smoke-test-windows:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: taipan-windows-x86_64
          path: dist
      # servercore is python-less but ships curl.exe/tar.exe; its version must
      # match the host (windows-latest = Server 2025, process isolation).
      - name: Smoke test artifact in servercore:ltsc2025
        shell: pwsh
        run: |
          docker run --rm -v "${PWD}:C:\w:ro" mcr.microsoft.com/windows/servercore:ltsc2025 `
            powershell -ExecutionPolicy Bypass -File C:\w\tests\smoke.ps1 C:\w\dist\taipan.exe C:\w\examples

  release:
    needs: [build-and-test, smoke-test, smoke-test-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: taipan-*
          path: dist
      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for d in taipan-*/; do
            name="${d%/}"
            src=("$d"*)
            ext=""
            case "${src[0]}" in *.exe) ext=".exe" ;; esac
            mv "${src[0]}" "$name$ext.bin"
            rm -rf "$d"
            mv "$name$ext.bin" "$name$ext"
          done
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes taipan-* \
            || gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" taipan-*
