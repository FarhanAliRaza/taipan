name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            vendor/zig
            vendor/cpython
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/fetch_toolchain.sh') }}

      - name: Fetch pinned toolchain
        run: ./tools/fetch_toolchain.sh

      - name: Check formatting
        run: ./vendor/zig/zig fmt --check src build.zig

      - name: Unit tests
        run: ./vendor/zig/zig build test

      - name: Build (release)
        run: ./vendor/zig/zig build -Drelease=true

      - name: Integration tests
        run: bash tests/test.sh

      - name: Report binary size
        run: ls -la zig-out/bin/taipan && ldd zig-out/bin/taipan

      - uses: actions/upload-artifact@v5
        with:
          name: taipan-linux-x86_64
          path: zig-out/bin/taipan

  smoke-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm-slim", "ubuntu:24.04", "fedora:latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: taipan-linux-x86_64
          path: dist
      - name: Smoke test artifact in ${{ matrix.image }}
        run: |
          chmod +x dist/taipan tests/smoke.sh
          docker run --rm -v "$PWD:/w:ro" "${{ matrix.image }}" \
            bash -c "install /w/dist/taipan /usr/local/bin/taipan && bash /w/tests/smoke.sh /usr/local/bin/taipan /w/examples"

  release:
    needs: [build-and-test, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: taipan-linux-x86_64
      - name: Attach binary to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv taipan taipan-linux-x86_64
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes taipan-linux-x86_64 \
            || gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" taipan-linux-x86_64
