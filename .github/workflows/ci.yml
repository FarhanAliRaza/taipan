name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: taipan-linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact: taipan-linux-aarch64
          - runner: macos-15
            artifact: taipan-macos-aarch64
          - runner: macos-15-intel
            artifact: taipan-macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            vendor/zig
            vendor/cpython
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_toolchain.sh') }}

      - name: Fetch pinned toolchain
        run: ./tools/fetch_toolchain.sh

      - name: Check formatting
        run: ./vendor/zig/zig fmt --check src build.zig

      - name: Unit tests
        run: ./vendor/zig/zig build test

      - name: Build (release)
        run: ./vendor/zig/zig build -Drelease=true

      - name: Integration tests
        run: bash tests/test.sh

      - name: Report binary size and linkage
        run: |
          ls -la zig-out/bin/taipan
          ldd zig-out/bin/taipan 2>/dev/null || otool -L zig-out/bin/taipan

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: zig-out/bin/taipan

  smoke-test:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        image: ["debian:bookworm-slim", "ubuntu:24.04", "fedora:latest"]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.runner == 'ubuntu-latest' && 'taipan-linux-x86_64' || 'taipan-linux-aarch64' }}
          path: dist
      - name: Smoke test artifact in ${{ matrix.image }}
        run: |
          chmod +x dist/taipan tests/smoke.sh
          docker run --rm -v "$PWD:/w:ro" "${{ matrix.image }}" \
            bash -c "install /w/dist/taipan /usr/local/bin/taipan && bash /w/tests/smoke.sh /usr/local/bin/taipan /w/examples"

  release:
    needs: [build-and-test, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: taipan-*
          path: dist
      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for d in taipan-*/; do
            name="${d%/}"
            mv "$d/taipan" "$name.bin"
            rm -rf "$d"
            mv "$name.bin" "$name"
          done
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes taipan-* \
            || gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" taipan-*
